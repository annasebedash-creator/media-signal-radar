# Media Signal Radar — configuration
# Topic: "Tekoäly Suomessa" — AI in Finnish public discourse

topic:
  name: "Tekoäly Suomessa"
  description: >
    AI in Finnish public discourse: launches, regulation, research, opinion,
    and business signals as covered by major Finnish media.

# Keyword prefilter (recall-oriented — the LLM classifier handles precision).
# substrings: case-insensitive substring match against title + lead.
#   Finnish is agglutinative, so stems match inflected forms
#   ("tekoäly" also hits "tekoälyn", "tekoälyä", "tekoäly-yhtiö", ...).
# patterns: regular expressions; use for short tokens that need word
#   boundaries. (?-i:...) keeps a pattern case-sensitive.
keywords:
  substrings:
    - tekoäly
    - generatiivi      # generatiivinen tekoäly
    - kielimalli       # (suuri) kielimalli = LLM
    - koneoppimi       # koneoppiminen/koneoppimisen
    - syväoppimi       # syväoppiminen
    - neuroverk        # neuroverkko/neuroverkot
    - chatgpt
    - openai
    - anthropic
    - copilot
    - deepseek
    - "gpt-"
    - claude
    - gemini
    - grok
    - mistral
    - nvidia
    - datakeskus     # data centers — core of Finnish AI discourse (energy, investments)
  patterns:
    - '\bAI\b'         # AI-malli, AI:n — uppercase only, see code
    - '\bLLM\b'

