name: Daily radar

on:
  schedule:
    # GitHub cron is UTC: 03:00 UTC = 06:00 Helsinki in summer (EEST),
    # 05:00 in winter — early morning either way.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch signals
        run: python -m radar.run_fetch

      - name: Classify signals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m radar.run_classify

      - name: Build digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m radar.run_digest

      - name: Render site
        run: python -m radar.run_site

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Daily radar: $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
